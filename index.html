<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nugttah Weekly Growth Log</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+CjxjaXJjbGUgY3g9IjMyIiBjeT0iMzIiIHI9IjMyIiBmaWxsPSIjMTQ0MzVlIi8+CjxjaXJjbGUgY3g9IjMyIiBjeT0iMzIiIHI9IjE1IiBmaWxsPSIjZWNhZjVmIi8+Cjwvc3ZnPg==">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-firestore-compat.min.js"></script>
<style>
  :root{
    /* sampled directly from the Nugttah x Barq brand deck */
    --espresso-900:#14435e;   /* brand navy — page bg, avatar, toast */
    --espresso-700:#184969;   /* secondary navy — labels on white */
    --cream-50:#ffffff;       /* white — text on navy, card surfaces */
    --cream-100:#dcefe6;      /* light mint tint — selected / highlight bg */
    --crema-500:#ecaf5f;      /* brand amber — logo pill, CTAs, active tab */
    --crema-600:#d89a46;      /* amber hover */
    --mint-500:#9dd3bc;       /* brand mint — eyebrows, underlines, subheads */
    --green-600:#3f9b72;      /* deep mint — filled stamp / checkmark bg */
    --green-100:#eaf5ef;      /* light mint tint (spare) */
    --ink:#0b2a40;            /* deep navy ink — primary text on white */
    --muted:rgba(11,42,64,0.58);
    --hollow:rgba(255,255,255,0.16);
    --radius:14px;
    --font-display:'Poppins', -apple-system, sans-serif;
    --font-body:'Inter', -apple-system, sans-serif;
    --font-mono:'Inter', -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow-x:hidden;}
  body{
    background:var(--espresso-900);
    color:var(--cream-50);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .wrap{max-width:760px;margin:0 auto;padding:28px 18px 64px;position:relative;z-index:1;}

  /* ---------- ambient background: always-on, mouse-reactive on desktop, ---------- */
  /* ---------- gently drifting on touch devices --------------------------------- */
  .ambient-glow{
    position:fixed;top:50%;left:50%;width:760px;height:760px;margin:-380px 0 0 -380px;
    border-radius:50%;pointer-events:none;z-index:0;filter:blur(90px);
    transition:transform 1.6s cubic-bezier(.16,1,.3,1);will-change:transform;
  }
  .ambient-glow-1{background:radial-gradient(circle,rgba(236,175,95,0.30),transparent 70%);transform:translate3d(-28vw,-26vh,0);}
  .ambient-glow-2{background:radial-gradient(circle,rgba(157,211,188,0.26),transparent 70%);transform:translate3d(26vw,22vh,0);}
  @media (hover:none){
    .ambient-glow-1{animation:driftA 24s ease-in-out infinite;}
    .ambient-glow-2{animation:driftB 28s ease-in-out infinite;}
  }
  @keyframes driftA{0%,100%{transform:translate3d(-28vw,-26vh,0);}50%{transform:translate3d(-14vw,-6vh,0);}}
  @keyframes driftB{0%,100%{transform:translate3d(26vw,22vh,0);}50%{transform:translate3d(12vw,6vh,0);}}

  /* Gate (name-picker) gets a bigger, brighter, always-moving treatment — the
     "front door" moment. Every other view keeps the smaller, calmer version
     above (mouse-parallax on desktop, slow drift on touch) so it doesn't
     distract from reading/filling in a form. Pure CSS, always animating
     here (not just on touch), so JS mouse-parallax is skipped for this
     view (see the script below) to avoid the two fighting over transform. */
  body.gate-active .ambient-glow{
    width:1200px;height:1200px;margin:-600px 0 0 -600px;filter:blur(120px);
  }
  body.gate-active .ambient-glow-1{
    background:radial-gradient(circle,rgba(236,175,95,0.46),transparent 68%);
    animation:driftGateA 17s ease-in-out infinite;
  }
  body.gate-active .ambient-glow-2{
    background:radial-gradient(circle,rgba(157,211,188,0.42),transparent 68%);
    animation:driftGateB 21s ease-in-out infinite;
  }
  @keyframes driftGateA{
    0%,100%{transform:translate3d(-34vw,-30vh,0) scale(1);}
    33%{transform:translate3d(-8vw,-2vh,0) scale(1.18);}
    66%{transform:translate3d(-22vw,18vh,0) scale(0.94);}
  }
  @keyframes driftGateB{
    0%,100%{transform:translate3d(32vw,28vh,0) scale(1);}
    33%{transform:translate3d(10vw,4vh,0) scale(0.92);}
    66%{transform:translate3d(24vw,-16vh,0) scale(1.16);}
  }
  @media (prefers-reduced-motion: reduce){
    .ambient-glow{transition:none;animation:none !important;transform:none !important;}
  }
  .topbar{padding:6px 4px 22px;position:relative;}
  .topbar::before{
    content:'';position:absolute;top:-210px;left:50%;transform:translateX(-50%);
    width:900px;height:900px;border-radius:50%;
    border:1px solid rgba(255,255,255,0.14);
    pointer-events:none;z-index:0;
  }
  .topbar > *{position:relative;z-index:1;}
  .eyebrow{
    font-family:var(--font-body);
    font-weight:600;
    font-size:11.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--mint-500);
    margin-bottom:8px;
  }
  .h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:clamp(28px,5vw,38px);
    line-height:1.08;
    margin:0;
    color:var(--cream-50);
  }
  .brand-underline{width:60px;height:4px;border-radius:4px;background:var(--mint-500);margin-top:12px;}
  .sub{color:rgba(255,255,255,0.62);font-size:14.5px;margin-top:10px;}

  .top-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin:22px 0 14px;}
  .role-note{color:rgba(255,255,255,0.55);font-size:12.5px;}
  .link-onnavy{background:none;border:none;color:rgba(255,255,255,0.6);font-size:12.5px;text-decoration:underline;cursor:pointer;padding:0;}
  .link-onnavy:hover{color:#fff;}

  .tabs{display:flex;gap:8px;margin:0 0 22px;position:relative;z-index:1;}
  .tab{
    font-family:var(--font-body);
    font-weight:600;
    font-size:13.5px;
    padding:11px 16px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.18);
    background:transparent;
    color:rgba(255,255,255,0.68);
    cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .tab:hover{border-color:rgba(255,255,255,0.38);color:var(--cream-50);}
  .tab.active{background:var(--crema-500);border-color:var(--crema-500);color:var(--espresso-900);}
  .tab:focus-visible{outline:2px solid var(--crema-500);outline-offset:2px;}

  .card{
    background:var(--cream-50);
    color:var(--ink);
    border-radius:var(--radius);
    padding:22px 22px 24px;
    box-shadow:0 18px 40px -20px rgba(0,0,0,0.55);
  }
  .card + .card{margin-top:16px;}

  .perforation{
    height:1px;
    margin:18px 0;
    background-image:repeating-linear-gradient(to right, rgba(11,42,64,0.20) 0 6px, transparent 6px 12px);
  }

  .or-divider{display:flex;align-items:center;gap:10px;margin:20px 0 14px;color:var(--muted);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;}
  .or-divider::before,.or-divider::after{content:'';flex:1;height:1px;background:rgba(11,42,64,0.15);}
  .manager-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  input[type="password"], input[type="text"], input[type="number"]{
    font-family:var(--font-body);font-size:14.5px;color:var(--ink);
    background:#fff;border:1.4px solid rgba(11,42,64,0.2);border-radius:10px;
    padding:10px 12px;max-width:200px;
  }
  input[type="password"]:focus, input[type="text"]:focus, input[type="number"]:focus{outline:2px solid var(--crema-500);outline-offset:1px;border-color:var(--crema-500);}
  .error-text{color:#c0483f;font-size:12.5px;margin-top:9px;}

  .file-list{margin-top:8px;display:flex;flex-direction:column;gap:6px;}
  .file-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:8px 10px;border-radius:8px;background:var(--cream-100);font-size:13px;
  }
  .file-row a{color:var(--ink);text-decoration:none;font-weight:600;}
  .file-row a:hover{text-decoration:underline;}
  .file-remove{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;}
  .file-remove:hover{color:#c0483f;}
  .upload-status{font-size:12.5px;color:var(--muted);margin-top:8px;}
  .upload-status.busy{animation:pulse 1.4s ease-in-out infinite;}
  @media (prefers-reduced-motion: no-preference){
    @keyframes pulse{0%,100%{opacity:.55;}50%{opacity:1;}}
  }

  /* --- stamp row (signature element) --- */
  .stamp-summary{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:6px;}
  .stamp-row{display:flex;gap:8px;flex-wrap:wrap;}
  .stamp{
    width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-body);font-size:11px;font-weight:700;
    border:1.6px dashed rgba(11,42,64,0.26);
    color:rgba(11,42,64,0.36);
    position:relative;
  }
  .stamp.filled{
    border:1.6px solid var(--green-600);
    background:var(--green-600);
    color:#fff;
    transform:rotate(-6deg);
  }
  .stamp-photo{padding:0;overflow:hidden;}
  .stamp-photo img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;}
  .stamp-count{font-family:var(--font-mono);font-size:12.5px;color:var(--muted);}

  .field{margin-top:16px;}
  .field label{
    display:block;font-size:13.5px;font-weight:600;
    margin-bottom:6px;color:var(--ink);
  }
  textarea, select{
    width:100%;
    font-family:var(--font-body);
    font-size:14.5px;
    color:var(--ink);
    background:#fff;
    border:1.4px solid rgba(11,42,64,0.18);
    border-radius:10px;
    padding:10px 12px;
    resize:vertical;
    min-height:64px;
  }
  select{min-height:auto;padding:9px 10px;}
  textarea:focus, select:focus{outline:2px solid var(--crema-500);outline-offset:1px;border-color:var(--crema-500);}

  .btn{
    font-family:var(--font-body);font-weight:700;font-size:14px;
    padding:12px 18px;border-radius:10px;border:none;cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--crema-500);color:var(--espresso-900);}
  .btn-primary:hover{background:var(--crema-600);}
  .btn-ghost{background:transparent;color:var(--espresso-700);border:1.4px solid rgba(11,42,64,0.22);}
  .btn-ghost:hover{border-color:rgba(11,42,64,0.4);}
  .btn:focus-visible{outline:2px solid var(--espresso-900);outline-offset:2px;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}

  .row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .link-btn{background:none;border:none;color:var(--muted);font-size:12.5px;text-decoration:underline;cursor:pointer;padding:0;}

  .week-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px;}
  .week-bar label{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,0.6);}
  .week-bar select{max-width:240px;}

  /* --- chip grid (person picker, gate only) --- */
  .dept-group{margin-top:18px;}
  .dept-group:first-child{margin-top:2px;}
  .dept-label{
    font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);margin-bottom:8px;
  }
  .chip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;}
  .chip{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:12px 8px 10px;border-radius:12px;
    border:1.4px solid rgba(11,42,64,0.14);background:#fff;
    cursor:pointer;text-align:center;position:relative;
    transition:border-color .12s ease, transform .12s ease;
  }
  .chip:hover{border-color:var(--crema-500);}
  .chip:focus-visible{outline:2px solid var(--crema-500);outline-offset:2px;}
  .avatar{
    width:40px;height:40px;border-radius:50%;
    background:var(--espresso-900);color:var(--cream-50);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);font-weight:600;font-size:13px;
  }
  .avatar-photo{
    width:40px;height:40px;border-radius:50%;
    object-fit:cover;display:block;
    border:1.5px solid rgba(11,42,64,0.1);
  }
  .chip .name{font-size:12.5px;font-weight:700;color:var(--ink);}
  .chip .title{font-size:10.5px;color:var(--muted);line-height:1.25;}

  /* --- gate facelift: wide "roster board" layout, gate view only --- */
  body.gate-active .wrap{max-width:2200px;width:100%;padding:44px 40px 72px;}
  body.gate-active .topbar{max-width:600px;margin:0 auto 6px;text-align:center;}
  body.gate-active .topbar::before{left:50%;}
  body.gate-active .brand-underline{margin-inline:auto;}
  body.gate-active .sub{max-width:480px;margin-inline:auto;}

  .dept-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:32px;}
  @media (max-width:640px){
    body.gate-active .wrap{padding:32px 16px 56px;}
    .dept-board{grid-template-columns:1fr;gap:14px;}
  }
  .dept-card{
    display:block;width:100%;
    background:var(--cream-50);border-radius:var(--radius);
    padding:20px 18px 14px;
    box-shadow:0 18px 40px -22px rgba(0,0,0,0.5);
  }
  .dept-card-label{
    font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);margin-bottom:8px;padding:0 8px;
  }
  .person-row{
    display:flex;align-items:center;gap:14px;width:100%;
    padding:12px 8px;border-radius:10px;border:none;background:transparent;
    cursor:pointer;text-align:left;transition:background .15s ease, transform .15s ease;
  }
  .person-row:hover{background:var(--cream-100);transform:translateX(3px);}
  .person-row:focus-visible{outline:2px solid var(--crema-500);outline-offset:2px;}
  .person-avatar-lg{
    width:56px;height:56px;border-radius:50%;flex-shrink:0;
    background:var(--espresso-900);color:var(--cream-50);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);font-weight:700;font-size:17px;
  }
  .person-avatar-photo-lg{
    width:56px;height:56px;border-radius:50%;flex-shrink:0;
    object-fit:cover;display:block;border:2px solid var(--cream-100);
    transition:border-color .15s ease;
  }
  .person-row:hover .person-avatar-photo-lg{border-color:var(--crema-500);}
  .person-info{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .person-name-lg{font-family:var(--font-display);font-weight:600;font-size:16px;color:var(--ink);}
  .person-title-lg{font-size:12.5px;color:var(--muted);line-height:1.3;}
  .manager-card{border:1.6px solid var(--crema-500);}
  .manager-card .dept-card-label{color:var(--crema-600);}

  /* --- report cards --- */
  .report-dept-title{
    font-family:var(--font-display);font-weight:600;font-size:19px;
    margin:26px 0 14px;color:var(--cream-50);
    position:relative;padding-bottom:9px;
  }
  .report-dept-title::after{
    content:'';position:absolute;left:0;bottom:0;width:38px;height:3px;border-radius:3px;
    background:var(--mint-500);
  }
  .report-dept-title:first-of-type{margin-top:6px;}
  .person-card{margin-bottom:12px;}
  .person-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .person-name{font-family:var(--font-display);font-weight:600;font-size:18px;}
  .person-title{font-size:12px;color:var(--muted);}
  .qa{margin-top:12px;}
  .qa .q{font-size:12px;font-weight:700;color:var(--crema-600);text-transform:uppercase;letter-spacing:.02em;}
  .qa .a{font-size:14.5px;margin-top:4px;line-height:1.5;}
  .empty-note{
    margin-top:12px;padding:10px 12px;border-radius:8px;
    border:1.4px dashed rgba(11,42,64,0.25);color:var(--muted);font-size:13px;
  }
  .meta-time{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-top:10px;}

  .mgr-note{margin-top:14px;padding-top:12px;border-top:1px dashed rgba(11,42,64,0.15);}
  .mgr-note-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--crema-600);margin-bottom:4px;}
  .mgr-note-view{background:rgba(236,175,95,0.12);border-radius:8px;padding:10px 12px;}
  .mgr-note-text{font-size:13px;color:var(--ink);white-space:pre-wrap;}
  .mgr-note-view .mgr-note-edit-btn{margin-top:6px;font-size:11.5px;}
  .mgr-note-add-btn{font-size:12.5px;}
  .mgr-note-textarea{
    width:100%;box-sizing:border-box;border-radius:8px;border:1.4px solid rgba(11,42,64,0.18);
    padding:8px 10px;font-family:var(--font-body);font-size:13px;resize:vertical;
  }

  .actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--espresso-900);color:var(--cream-50);
    border:1px solid var(--crema-500);
    padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:600;
    box-shadow:0 12px 30px -12px rgba(0,0,0,0.6);
    opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;
    z-index:50;
    max-width:88vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .loading{color:var(--muted);font-size:13.5px;padding:12px 2px;}

  @media (prefers-reduced-motion: no-preference){
    .stamp.filled{animation:stampin .28s ease;}
    @keyframes stampin{from{transform:scale(0.5) rotate(-6deg);opacity:0;}to{transform:scale(1) rotate(-6deg);opacity:1;}}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }

  @media print{
    body{background:#fff;color:#000;}
    .topbar .eyebrow{color:#2f6b52;}
    .topbar::before{display:none;}
    #authArea,#topRow,.tabs,.actions,.week-bar .link-btn,.chip-grid,.dept-group,#formArea,.toast{display:none !important;}
    .card{box-shadow:none;border:1px solid #ddd;}
    .wrap{max-width:100%;padding:0;}
  }

  footer{margin-top:36px;text-align:center;font-family:var(--font-mono);font-size:11px;color:rgba(255,255,255,0.4);}
</style>
</head>
<body>
<div class="ambient-glow ambient-glow-1" aria-hidden="true"></div>
<div class="ambient-glow ambient-glow-2" aria-hidden="true"></div>
<div class="wrap">
  <div class="topbar">
    <div class="eyebrow">Nugttah · Marketing Team</div>
    <h1 class="h1">Weekly Growth Log</h1>
    <div class="brand-underline"></div>
    <div class="sub" id="subline"></div>
  </div>
  <div id="authArea"></div>
  <div class="top-row" id="topRow" style="display:none;"></div>
  <nav class="tabs" id="tabs" style="display:none;"></nav>
  <main id="view"></main>
  <footer>Internal tool · your check-ins are visible to you and your manager only</footer>
</div>
<div class="toast" id="toast"></div>

<input type="file" id="fileInput" multiple style="display:none;">

<script>
(function(){

  function teamById(id){ for(var i=0;i<TEAM.length;i++){ if(TEAM[i].id===id) return TEAM[i]; } return null; }

  // ---------- utils ----------
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }
  function initials(name){ return name.slice(0,2).toUpperCase(); }
  function stampHtml(p, filled){
    var stateClass = filled ? ' filled' : '';
    var titleAttr = esc(p.name) + (filled ? ' — submitted' : ' — pending');
    if(p.photo){
      return '<span class="stamp stamp-photo'+stateClass+'" title="'+titleAttr+'"><img src="'+p.photo+'" alt=""></span>';
    }
    return '<span class="stamp'+stateClass+'" title="'+titleAttr+'">'+esc(initials(p.name))+'</span>';
  }
  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function toISODate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function getWeekStart(date){
    var d = new Date(date); d.setHours(0,0,0,0);
    var day = d.getDay();
    d.setDate(d.getDate()-day);
    return d;
  }
  function currentWeekId(){ return toISODate(getWeekStart(new Date())); }
  function weekIdOffset(weekId, weeksBack){
    var d = new Date(weekId+'T00:00:00');
    d.setDate(d.getDate()-weeksBack*7);
    return toISODate(d);
  }
  function formatWeekLabel(weekId){
    // Saudi work week: Sunday through Thursday
    var start = new Date(weekId+'T00:00:00');
    var end = new Date(start); end.setDate(end.getDate()+4);
    var startStr = start.toLocaleDateString('en-US', {month:'short', day:'numeric'});
    var endStr = end.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
    return 'Week of ' + startStr + ' – ' + endStr;
  }
  function formatTime(iso){
    try{
      var d = new Date(iso);
      return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ', ' + d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    }catch(e){ return ''; }
  }

  var _submitAudio = null;
  function playSubmitSound(){
    try{
      if(!_submitAudio){ _submitAudio = new Audio(SUBMIT_SOUND_SRC); }
      _submitAudio.currentTime = 0;
      return _submitAudio.play().catch(function(e){ console.warn("submit sound blocked", e); });
    }catch(e){ console.warn("submit sound failed", e); return Promise.resolve(); }
  }
  // Same as playSubmitSound(), but returns a promise that only resolves once
  // the clip has actually finished (or ~2.2s have passed as a safety net).
  // Needed before anything that calls window.print() — a native print dialog
  // freezes the whole browser the instant it opens, which was cutting the
  // sound off entirely in Chrome before it had even started rendering.
  function playSubmitSoundAndWait(){
    playSubmitSound();
    return new Promise(function(resolve){
      var done = false;
      function finish(){ if(!done){ done = true; resolve(); } }
      if(_submitAudio){ _submitAudio.addEventListener('ended', finish, {once:true}); }
      setTimeout(finish, 2200);
    });
  }

  function cloudinaryReady(){
    return CLOUDINARY_CLOUD_NAME.indexOf('PASTE_YOUR') !== 0
        && CLOUDINARY_UPLOAD_PRESET.indexOf('PASTE_YOUR') !== 0;
  }

  function uploadFile(file, onProgress){
    return new Promise(function(resolve, reject){
      if(!cloudinaryReady()){ reject(new Error('cloudinary-not-configured')); return; }
      var url = 'https://api.cloudinary.com/v1_1/' + CLOUDINARY_CLOUD_NAME + '/auto/upload';
      var formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

      var xhr = new XMLHttpRequest();
      xhr.open('POST', url, true);
      xhr.upload.onprogress = function(e){
        if(onProgress && e.lengthComputable){
          onProgress(Math.round((e.loaded / e.total) * 100));
        }
      };
      xhr.onload = function(){
        if(xhr.status >= 200 && xhr.status < 300){
          try{
            var data = JSON.parse(xhr.responseText);
            resolve({ name: data.original_filename || file.name, url: data.secure_url });
          }catch(e){
            reject(new Error('bad-response-from-cloudinary'));
          }
        } else {
          var msg = 'upload-failed (status ' + xhr.status + ')';
          try{
            var errData = JSON.parse(xhr.responseText);
            if(errData && errData.error && errData.error.message) msg = errData.error.message;
          }catch(e){}
          reject(new Error(msg));
        }
      };
      xhr.onerror = function(){ reject(new Error('network-error')); };
      xhr.send(formData);
    });
  }


  async function getSubmission(weekId, personId){
    if(!db) return null;
    try{
      var doc = await db.collection('submissions').doc(weekId+'_'+personId).get();
      return doc.exists ? doc.data() : null;
    }catch(e){ console.error('getSubmission failed', e); return null; }
  }
  async function saveSubmission(weekId, personId, payload){
    if(!db) throw new Error('firebase-not-configured');
    await db.collection('submissions').doc(weekId+'_'+personId).set(payload);
    try{ await ensureWeekInIndex(weekId); }
    catch(e){ console.error('index update failed (non-fatal)', e); }
  }
  // One query for the whole week — Firestore's document-ID range trick,
  // genuinely a single fast round-trip (this was 8 separate slow calls
  // back when the backend was Apps Script).
  async function getManagerNotesMap(weekId){
    var map = {};
    if(!db) return map;
    try{
      var prefix = weekId+'_';
      var snap = await db.collection('managerNotes')
        .orderBy(firebase.firestore.FieldPath.documentId())
        .startAt(prefix)
        .endAt(prefix+'\uf8ff')
        .get();
      snap.forEach(function(doc){
        map[doc.id.slice(prefix.length)] = doc.data().note || '';
      });
    }catch(e){ console.error('getManagerNotesMap failed', e); }
    return map;
  }
  async function saveManagerNote(weekId, personId, note){
    if(!db) return false;
    try{
      var ref = db.collection('managerNotes').doc(weekId+'_'+personId);
      if(note){
        await ref.set({ note: note, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      } else {
        await ref.delete();
      }
      return true;
    }catch(e){ console.error('saveManagerNote failed', e); return false; }
  }

  async function getSubmittedMap(weekId){
    var map = {};
    if(!db) return map;
    try{
      var prefix = weekId+'_';
      var snap = await db.collection('submissions')
        .orderBy(firebase.firestore.FieldPath.documentId())
        .startAt(prefix)
        .endAt(prefix+'\uf8ff')
        .get();
      snap.forEach(function(doc){
        map[doc.id.slice(prefix.length)] = doc.data();
      });
    }catch(e){ console.error('getSubmittedMap failed', e); }
    return map;
  }
  async function getWeeksIndex(){
    if(!db) return [];
    try{
      var doc = await db.collection('meta').doc('weeksIndex').get();
      return (doc.exists && Array.isArray(doc.data().weeks)) ? doc.data().weeks : [];
    }catch(e){ return []; }
  }
  async function ensureWeekInIndex(weekId){
    var idx = await getWeeksIndex();
    if(idx.indexOf(weekId) === -1){
      idx.push(weekId); idx.sort(); idx.reverse();
      await db.collection('meta').doc('weeksIndex').set({ weeks: idx });
    }
  }
  async function getPin(personId){
    if(!db) return null;
    try{
      var doc = await db.collection('pins').doc(personId).get();
      return doc.exists ? doc.data().pin : null;
    }catch(e){ console.error('getPin failed', e); return null; }
  }
  async function setPin(personId, pin){

    await db.collection('pins').doc(personId).set({ pin: pin });
  }
  async function deletePin(personId){
    if(!db) return false;
    try{ await db.collection('pins').doc(personId).delete(); return true; }
    catch(e){ console.error('deletePin failed', e); return false; }
  }


  // ---------- shared render helper ----------
  function normalizeAttachments(items){
    if(!items) return [];
    if(Array.isArray(items)){
      return items.map(function(it){
        if(it && typeof it === 'object') return { name: it.name || it.url, url: it.url };
        return { name: String(it), url: String(it) };
      });
    }
    if(typeof items === 'string' && items.trim()){
      return items.split('\n').map(function(s){ return s.trim(); }).filter(Boolean).map(function(link){
        return { name: link, url: link };
      });
    }
    return [];
  }
  function attachmentLinksHtml(sub){
    var list = normalizeAttachments(sub && sub.attachments);
    if(!list.length) return '';
    var out = '<div class="qa"><div class="q">Attachments</div><div class="a">';
    list.forEach(function(item){
      var safeHref = /^https?:\/\//i.test(item.url) ? esc(item.url) : '#';
      out += '<div><a href="'+safeHref+'" target="_blank" rel="noopener noreferrer">📎 '+esc(item.name)+'</a></div>';
    });
    out += '</div></div>';
    return out;
  }
  function personCardHtml(person, sub, managerNoteInfo){
    var out = '<div class="card person-card">';
    out += '  <div class="person-head"><div><div class="person-name">'+esc(person.name)+'</div><div class="person-title">'+esc(person.title)+'</div></div></div>';
    if(sub){
      person.questions.forEach(function(q){
        var ans = (sub.answers && sub.answers[q.id]) ? sub.answers[q.id] : '';
        if(!ans) return;
        out += '<div class="qa"><div class="q">'+esc(q.label)+'</div><div class="a">'+nl2br(ans)+'</div></div>';
      });
      out += attachmentLinksHtml(sub);
      out += '<div class="meta-time">Submitted '+esc(formatTime(sub.submittedAt))+'</div>';
    } else {
      out += '<div class="empty-note">No update submitted yet.</div>';
    }
    // Manager-only note. Only ever passed in from the manager's own report
    // view (renderReportView) — never from a team member's "My report" tab,
    // and never read by buildBrandedReport / buildPlainTextReport (they have
    // their own separate card-building code and never see this object) — so
    // it structurally cannot leak into Export or Copy.
    if(managerNoteInfo){
      var noteVal = managerNoteInfo.note || '';
      out += '<div class="mgr-note" data-week="'+esc(managerNoteInfo.weekId)+'" data-person="'+esc(person.id)+'" data-note="'+esc(noteVal)+'">';
      out += '  <div class="mgr-note-view" style="'+(noteVal?'':'display:none;')+'">';
      out += '    <div class="mgr-note-label">Private note (only you see this)</div>';
      out += '    <div class="mgr-note-text">'+nl2br(noteVal)+'</div>';
      out += '    <button type="button" class="link-btn mgr-note-edit-btn">Edit note</button>';
      out += '  </div>';
      out += '  <button type="button" class="link-btn mgr-note-add-btn" style="'+(noteVal?'display:none;':'')+'">+ Add private note</button>';
      out += '  <div class="mgr-note-edit" style="display:none;">';
      out += '    <textarea class="mgr-note-textarea" rows="2" placeholder="e.g. Bring this up in our 1:1…"></textarea>';
      out += '    <div style="display:flex;gap:8px;margin-top:6px;">';
      out += '      <button type="button" class="btn btn-primary mgr-note-save-btn" style="padding:6px 14px;font-size:12.5px;">Save</button>';
      out += '      <button type="button" class="link-btn mgr-note-cancel-btn">Cancel</button>';
      out += '    </div>';
      out += '  </div>';
      out += '</div>';
    }
    out += '</div>';
    return out;
  }

      function openEditor(){
        textarea.value = box.dataset.note || '';
        editBox.style.display = 'block';
        addBtn.style.display = 'none';
        viewEl.style.display = 'none';
        textarea.focus();
      }
      addBtn.onclick = openEditor;
      editBtn.onclick = openEditor;
      cancelBtn.onclick = function(){
        editBox.style.display = 'none';
        if(box.dataset.note){ viewEl.style.display = 'block'; } else { addBtn.style.display = 'inline'; }
      };
      saveBtn.onclick = async function(){
        saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
        var val = textarea.value.trim();
        var ok = await saveManagerNote(weekId, personId, val);
        saveBtn.disabled = false; saveBtn.textContent = 'Save';

        box.dataset.note = val;
        textDiv.innerHTML = nl2br(val);
        editBox.style.display = 'none';
        if(val){ viewEl.style.display = 'block'; } else { addBtn.style.display = 'inline'; }

        out += '<div class="qa"><div class="q">'+esc(q.label)+'</div><div class="a">'+nl2br(ans)+'</div></div>';

  // ================= PER-PERSON PASSCODE =================

  function renderPinForm(existingPin){
    var person = state.pendingPerson;
    var creating = state.pinMode === 'create';

    var out = '<div class="card">';
    out += '  <button type="button" class="link-btn" id="pinBackBtn">‹ Back</button>';
    out += '  <div class="person-head" style="margin-top:10px;"><div><div class="person-name">'+esc(person.name)+'</div><div class="person-title">'+esc(person.title)+'</div></div></div>';
    if(creating){
      out += '  <div style="font-size:13.5px;color:var(--muted);margin:10px 0 14px;">First time here — set a passcode so only you can open your check-ins. You will enter this every time you sign in as '+esc(person.name)+'.</div>';
      out += '  <div class="field"><label for="pin1">Create a passcode</label><input type="password" id="pin1" autocomplete="off" maxlength="20"></div>';
      out += '  <div class="field"><label for="pin2">Confirm passcode</label><input type="password" id="pin2" autocomplete="off" maxlength="20"></div>';
      out += '  <div class="row" style="margin-top:16px;"><button type="button" class="btn btn-primary" id="pinSubmitBtn">Save passcode</button></div>';
    } else {
      out += '  <div style="font-size:13.5px;color:var(--muted);margin:10px 0 14px;">Enter your passcode to continue.</div>';
      out += '  <div class="field"><label for="pin1">Passcode</label><input type="password" id="pin1" autocomplete="off" maxlength="20"></div>';
      out += '  <div class="row" style="margin-top:16px;"><button type="button" class="btn btn-primary" id="pinSubmitBtn">Continue</button></div>';
      out += '  <div style="font-size:12px;color:var(--muted);margin-top:10px;">Forgot it? Ask your manager to reset it for you.</div>';
    }
    out += '  <div class="error-text" id="pinError" style="display:none;"></div>';
    out += '</div>';
    authArea.innerHTML = out;

    document.getElementById('pinBackBtn').onclick = function(){
      state.pendingPerson = null;
      state.pinMode = null;
      renderGate();
    };

    function showPinError(msg){
      var el = document.getElementById('pinError');
      el.textContent = msg;
      el.style.display = 'block';
    }

    async function submitPin(){
      var btn = document.getElementById('pinSubmitBtn');
      var val1 = (document.getElementById('pin1').value||'').trim();
      if(creating){
        var val2 = (document.getElementById('pin2').value||'').trim();
        if(val1.length < 4){ showPinError('Use at least 4 characters.'); return; }
        if(val1 !== val2){ showPinError('Passcodes do not match.'); return; }
        btn.disabled = true; btn.textContent = 'Saving…';
        try{
          await setPin(person.id, val1);
          signInAs(person);
        }catch(e){
          console.error(e);
          btn.disabled = false; btn.textContent = 'Save passcode';
          showPinError('Could not save your passcode — try again.');
        }
      } else {
        if(val1 === String(existingPin)){
          signInAs(person);
        } else {
          showPinError('That passcode is not right.');
        }
      }
    }
    document.getElementById('pinSubmitBtn').onclick = submitPin;
    authArea.querySelectorAll('input[type="password"]').forEach(function(inp){
      inp.addEventListener('keydown', function(e){ if(e.key === 'Enter') submitPin(); });
    });
  }

  function signInAs(person){
    state.identity = { type:'member', person: person };
    state.pendingPerson = null;
    state.pinMode = null;
    state.activeTab = 'submit';
    authArea.innerHTML = '';
    renderApp();
  }

  // ================= APP SHELL =================

    document.body.classList.remove('gate-active');

  // ================= SUBMIT VIEW (member) =================
  async function renderSubmitView(){
    var person = state.identity.person;
    var weekOptions = [0,1,2].map(function(w){ return weekIdOffset(currentWeekId(), w); });

    var out = '';
    out += '<div class="card">';
    out += '  <div class="week-bar">';
    out += '    <label for="submitWeekSel">Logging for</label>';
    out += '    <select id="submitWeekSel">';
    weekOptions.forEach(function(wid, i){
      var label = i===0 ? 'This week — ' + formatWeekLabel(wid) : (i===1 ? 'Last week — ' + formatWeekLabel(wid) : formatWeekLabel(wid));
      out += '<option value="'+wid+'" '+(wid===state.submitWeekId?'selected':'')+'>'+esc(label)+'</option>';
    });
    out += '    </select>';
    out += '  </div>';
    out += '  <div class="perforation"></div>';
    out += '  <div id="formArea" class="loading">Loading your form…</div>';
    out += '</div>';
    viewEl.innerHTML = out;

    document.getElementById('submitWeekSel').onchange = function(e){
      state.submitWeekId = e.target.value;
      renderSubmitView();
    };

    var existing = await getSubmission(state.submitWeekId, person.id);
    var answers = existing ? existing.answers : {};
    var currentAttachments = normalizeAttachments(existing && existing.attachments);
    var formArea = document.getElementById('formArea');
    formArea.classList.remove('loading');

    var pHtml = '';
    if(existing) pHtml += '<div class="meta-time" style="margin-bottom:10px;">Last saved '+esc(formatTime(existing.submittedAt))+' — saving again will overwrite it</div>';
    pHtml += '<form id="answerForm">';
    person.questions.forEach(function(q){
      var required = q.id === 'shipped';
      pHtml += '  <div class="field">';
      pHtml += '    <label for="q_'+q.id+'">'+esc(q.label)+(required?' *':'')+'</label>';
      pHtml += '    <textarea id="q_'+q.id+'" name="'+q.id+'" rows="'+(q.id==='shipped'?3:2)+'" '+(required?'required':'')+'>'+esc(answers[q.id]||'')+'</textarea>';
      pHtml += '  </div>';
    });
    pHtml += '  <div class="field">';
    pHtml += '    <label>Attachments (optional)</label>';
    pHtml += '    <div class="file-list" id="fileList"></div>';
    pHtml += '    <div class="row" style="margin-top:8px;justify-content:flex-start;">';
    pHtml += '      <button type="button" class="btn btn-ghost" id="chooseFilesBtn">+ Add files</button>';
    pHtml += '    </div>';
    pHtml += '    <div class="upload-status" id="uploadStatus"></div>';
    pHtml += '  </div>';
    pHtml += '  <div class="row" style="margin-top:18px;">';
    pHtml += '    <button type="submit" class="btn btn-primary">Stamp my update</button>';
    pHtml += '    <button type="button" id="clearBtn" class="link-btn">Clear my answers</button>';
    pHtml += '  </div>';
    pHtml += '</form>';
    formArea.innerHTML = pHtml;

    function renderFileList(){
      var el = document.getElementById('fileList');
      if(!el) return;
      if(!currentAttachments.length){ el.innerHTML = ''; return; }
      var html = '';
      currentAttachments.forEach(function(f, idx){
        html += '<div class="file-row"><a href="'+esc(f.url)+'" target="_blank" rel="noopener noreferrer">📎 '+esc(f.name)+'</a><button type="button" class="file-remove" data-idx="'+idx+'" title="Remove">✕</button></div>';
      });
      el.innerHTML = html;
      el.querySelectorAll('.file-remove').forEach(function(btn){
        btn.onclick = function(){
          currentAttachments.splice(parseInt(btn.dataset.idx, 10), 1);
          renderFileList();
        };
      });
    }
    renderFileList();

    document.getElementById('chooseFilesBtn').onclick = function(){
      document.getElementById('fileInput').click();
    };
    document.getElementById('fileInput').onchange = async function(e){
      var files = Array.prototype.slice.call(e.target.files || []);
      if(!files.length) return;
      var statusEl = document.getElementById('uploadStatus');
      statusEl.classList.add('busy');
      for(var i=0;i<files.length;i++){
        statusEl.textContent = 'Uploading ' + files[i].name + ' (' + (i+1) + '/' + files.length + ')… 0%';
        try{
          var result = await uploadFile(files[i], function(pct){
            statusEl.textContent = 'Uploading ' + files[i].name + ' (' + (i+1) + '/' + files.length + ')… ' + pct + '%';
          });
          currentAttachments.push(result);
          renderFileList();
        }catch(err){
          console.error(err);
          var detail = (err && err.message) ? err.message : String(err);
          if(detail === 'cloudinary-not-configured'){
            showToast("Setup isn't finished — Mazen needs to add the Cloudinary details yet.");
          } else {
            showToast('Upload failed for ' + files[i].name + ': ' + detail);
          }
        }
      }
      statusEl.classList.remove('busy');
      statusEl.textContent = '';
      e.target.value = '';
    };

    document.getElementById('answerForm').onsubmit = async function(e){
      e.preventDefault();
      var submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true; submitBtn.textContent = 'Stamping…';
      var newAnswers = {};
      person.questions.forEach(function(q){
        newAnswers[q.id] = document.getElementById('q_'+q.id).value.trim();
      });
      var payload = {
        personId: person.id, name: person.name, title: person.title, dept: person.dept,
        answers: newAnswers,
        attachments: currentAttachments,
        submittedAt: new Date().toISOString()
      };
      try{
        await saveSubmission(state.submitWeekId, person.id, payload);
        playSubmitSound();
        showToast('Stamped! Thanks, ' + person.name + '.');
        renderSubmitView();
      }catch(err){
        console.error(err);
        submitBtn.disabled = false; submitBtn.textContent = 'Stamp my update';
        var detail = (err && err.message) ? err.message : String(err);
        if(detail === 'firebase-not-configured'){
          showToast("Setup isn't finished — Mazen needs to add the Firebase config yet.");
        } else {
          showToast('Save failed: ' + detail + ' — try again or tell Mazen this message.');
        }
      }
    };
    document.getElementById('clearBtn').onclick = function(){
      person.questions.forEach(function(q){
        var el = document.getElementById('q_'+q.id);
        if(el) el.value = '';
      });
      currentAttachments = [];
      renderFileList();
    };
  }

        document.querySelectorAll('.weekCheck:checked'),
        function(b){ return b.value; }
      );
      return idx.filter(function(wid){ return checked.indexOf(wid) !== -1; });

    document.getElementById('exportBtn').onclick = async function(){
      var exportBtn = this;
      // Started immediately, synchronously, inside the click handler — tied
      // to the click itself. Its promise is awaited (alongside the Firestore
      // fetches below) so the clip is guaranteed to finish BEFORE
      // window.print() can fire: that print dialog freezes the whole browser
      // the instant it opens, which was cutting the sound off in Chrome
      // before it had even started.
      var soundDone = playSubmitSoundAndWait();
      var weekIds = getSelectedWeekIds();
      if(!weekIds.length){ showToast('Pick at least one week first.'); return; }
      exportBtn.disabled = true; exportBtn.textContent = 'Preparing…';
      var dataByWeek = {};
      var fetchDone = (async function(){
        for(var j=0;j<weekIds.length;j++){
          dataByWeek[weekIds[j]] = (weekIds[j] === state.reportWeekId) ? submitted : await getSubmittedMap(weekIds[j]);
        }
      })();
      await Promise.all([soundDone, fetchDone]);
      exportBtn.disabled = false; exportBtn.textContent = 'Export branded report';
      var html = buildBrandedReport(weekIds, dataByWeek);
      var win = window.open('', '_blank');
      if(!win){ showToast('Pop-up blocked — allow pop-ups for this page and try again.'); return; }
      win.document.write(html);
      win.document.close();
    };
    document.getElementById('copyBtn').onclick = async function(){
      var weekIds = getSelectedWeekIds();
      if(!weekIds.length){ showToast('Pick at least one week first.'); return; }
      var dataByWeek = {};
      for(var j=0;j<weekIds.length;j++){
        dataByWeek[weekIds[j]] = (weekIds[j] === state.reportWeekId) ? submitted : await getSubmittedMap(weekIds[j]);
      }
      var text = buildPlainTextReport(weekIds, dataByWeek);
      try{
        await navigator.clipboard.writeText(text);
        showToast('Report copied to clipboard.');
      }catch(e){
        showToast('Could not copy automatically — select the report text manually.');
      }
    };
    document.getElementById('resetPinBtn').onclick = async function(){
      var sel = document.getElementById('resetPersonSel');
      var pid = sel.value;
      var pname = sel.options[sel.selectedIndex].text;
      if(!confirm('Reset the passcode for ' + pname + '? They will need to set a new one next time.')) return;
      var ok = await deletePin(pid);
      showToast(ok ? (pname + '’s passcode was reset.') : 'Could not reset it — try again.');
    };
  }

  // Manager report view, single-person mode: same "Week" dropdown anchors
  // the most recent week shown; a small range control controls how many
  // weeks back to pull. Export/Copy/Print stay tied to the full-team report
  // and are intentionally not shown here — this view is for quick 1:1 prep,
  // not for producing a document.
  async function renderPersonHistoryView(){
    var person = teamById(state.reportPersonId);
    var summaryEl = document.getElementById('stampSummary');
    summaryEl.classList.remove('loading');
    summaryEl.innerHTML = '<div class="stamp-summary" style="display:flex;align-items:center;gap:12px;">'
      + '<div class="person-name" style="font-size:16px;">'+esc(person.name)+'</div>'
      + '<div class="person-title" style="color:var(--muted);">'+esc(person.title)+'</div>'
      + '</div>';

    var bodyHtml = '<div class="card" style="margin-bottom:16px;">';
    bodyHtml += '  <label style="display:flex;align-items:center;gap:8px;color:rgba(255,255,255,0.75);font-size:13px;font-weight:600;">';
    bodyHtml += '    Weeks to look back: <input type="number" id="historyRangeInput" min="1" max="26" value="'+(state.historyWeeksBack||6)+'" style="width:64px;">';
    bodyHtml += '    <button type="button" class="btn btn-ghost" id="historyRangeApply">Apply</button>';
    bodyHtml += '  </label>';
    bodyHtml += '</div>';
    bodyHtml += '<div id="historyCards" class="loading">Loading history…</div>';
    document.getElementById('reportBody').innerHTML = bodyHtml;

    var weeksBack = state.historyWeeksBack || 6;
    var weekIds = [];
    for(var i=0;i<weeksBack;i++){ weekIds.push(weekIdOffset(state.reportWeekId, i)); }

    var cardsHtml = '';
    for(var j=0;j<weekIds.length;j++){
      var map = await getSubmittedMap(weekIds[j]);
      cardsHtml += personWeekCardHtml(person, weekIds[j], map[person.id]);
    }
    var cardsEl = document.getElementById('historyCards');
    cardsEl.classList.remove('loading');
    cardsEl.innerHTML = cardsHtml;

    document.getElementById('historyRangeApply').onclick = function(){
      var v = parseInt(document.getElementById('historyRangeInput').value, 10) || 6;
      if(v < 1) v = 1;
      if(v > 26) v = 26;
      state.historyWeeksBack = v;
      renderPersonHistoryView();
    };
  }

  function buildPlainTextReport(weekIds, dataByWeek){
    var lines = [];
    lines.push('NUGTTAH — WEEKLY GROWTH LOG');
    var multi = weekIds.length > 1;
    lines.push(multi ? (weekIds.length + ' weeks selected') : formatWeekLabel(weekIds[0]));
    lines.push('');
    weekIds.forEach(function(weekId){
      var submitted = dataByWeek[weekId] || {};
      if(multi){
        lines.push('#### ' + formatWeekLabel(weekId) + ' ####');
        lines.push('');
      }
      DEPT_ORDER.forEach(function(dept){
        var people = teamByDept(dept);
        if(!people.length) return;
        lines.push('== ' + dept.toUpperCase() + ' ==');
        people.forEach(function(p){
          var sub = submitted[p.id];
          lines.push('');
          lines.push(p.name + ' — ' + p.title);
          if(sub){
            p.questions.forEach(function(q){
              var ans = (sub.answers && sub.answers[q.id]) ? sub.answers[q.id] : '';
              if(!ans) return;
              lines.push('  ' + q.label);
              lines.push('  > ' + ans.replace(/\n/g,'\n  > '));
            });
            var attList = normalizeAttachments(sub.attachments);
            if(attList.length){
              lines.push('  Attachments');
              attList.forEach(function(item){ lines.push('  > ' + item.name + ' — ' + item.url); });
            }
          } else {
            lines.push('  (no update submitted)');
          }
        });
        lines.push('');
      });
    });
    return lines.join('\n');
  }

  function buildBrandedReport(weekIds, dataByWeek){
    var now = new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
    var multi = weekIds.length > 1;
    var rangeLabel;
    if(!multi){
      rangeLabel = formatWeekLabel(weekIds[0]);
    } else {
      var latest = weekIds[0], earliest = weekIds[weekIds.length-1];
      var startD = new Date(earliest+'T00:00:00');
      var endD = new Date(latest+'T00:00:00'); endD.setDate(endD.getDate()+4);
      var startStr = startD.toLocaleDateString('en-US',{month:'short',day:'numeric'});
      var endStr = endD.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
      rangeLabel = startStr + ' – ' + endStr + ' ('+weekIds.length+' weeks)';
    }

    var unionSubmitted = {};
    weekIds.forEach(function(wid){
      Object.keys(dataByWeek[wid] || {}).forEach(function(pid){ unionSubmitted[pid] = true; });
    });
    var unionCount = Object.keys(unionSubmitted).length;

    var body = '';
    weekIds.forEach(function(weekId, idx){
      var submitted = dataByWeek[weekId] || {};
      var wCount = Object.keys(submitted).length;
      body += '<div class="week-block'+(idx===0?' first':'')+'">';
      if(multi){
        body += '  <div class="week-block-header">';
        body += '    <div class="week-block-title">'+esc(formatWeekLabel(weekId))+'</div>';
        body += '    <div class="week-block-stamps">';
        body += TEAM.map(function(p){ return stampHtml(p, !!submitted[p.id]); }).join('');
        body += '      <span class="stamp-count-inline">'+wCount+'/'+TEAM.length+'</span>';
        body += '    </div>';
        body += '  </div>';
      }
      DEPT_ORDER.forEach(function(dept){
        var people = teamByDept(dept);
        if(!people.length) return;
        body += '<div class="dept-section">';
        body += '  <h2 class="dept-title">'+esc(dept)+'</h2>';
        people.forEach(function(p){
          var sub = submitted[p.id];
          body += '<div class="person-card">';
          body += '  <div class="person-header">';
          body += p.photo
            ? '    <div class="person-avatar person-avatar-photo"><img src="'+p.photo+'" alt=""></div>'
            : '    <div class="person-avatar">'+esc(initials(p.name))+'</div>';
          body += '    <div><div class="person-name">'+esc(p.name)+'</div><div class="person-role">'+esc(p.title)+'</div></div>';
          body += '  </div>';
          if(sub){
            p.questions.forEach(function(q){
              var ans = (sub.answers && sub.answers[q.id]) ? sub.answers[q.id] : '';
              if(!ans) return;
              body += '<div class="qa"><div class="q-label">'+esc(q.label)+'</div><div class="a-text">'+nl2br(ans)+'</div></div>';
            });
            var atts = normalizeAttachments(sub.attachments);
            if(atts.length){
              body += '<div class="qa"><div class="q-label">Attachments</div><div class="a-text">';
              atts.forEach(function(a){
                body += '<a href="'+esc(a.url)+'" target="_blank">'+esc(a.name)+'</a><br>';
              });
              body += '</div></div>';
            }
            body += '<div class="submitted-at">Submitted '+esc(formatTime(sub.submittedAt))+'</div>';
          } else {
            body += '<div class="no-update">No update submitted</div>';
          }
          body += '</div>';
        });
        body += '</div>';
      });
      body += '</div>';
    });

    return '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">'
    + '<title>Nugttah Weekly Growth Log — '+esc(rangeLabel)+'</title>'
    + '<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">'
    + '<style>'
    + '*{box-sizing:border-box;margin:0;padding:0;}'
    + 'body{font-family:"Inter",-apple-system,sans-serif;color:#0b2a40;background:#fff;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact;}'
    + '.cover{background:#14435e;color:#fff;padding:52px 48px 44px;position:relative;overflow:hidden;}'
    + '.cover::before{content:"";position:absolute;top:-300px;left:50%;transform:translateX(-50%);width:1000px;height:1000px;border-radius:50%;border:1px solid rgba(255,255,255,0.12);pointer-events:none;}'
    + '.eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#9dd3bc;margin-bottom:10px;}'
    + '.cover h1{font-family:"Poppins",sans-serif;font-weight:600;font-size:32px;line-height:1.1;}'
    + '.cover-underline{width:50px;height:3.5px;border-radius:3px;background:#9dd3bc;margin:14px 0 12px;}'
    + '.cover-meta{font-size:13px;color:rgba(255,255,255,0.6);margin-top:6px;}'
    + '.stamp-bar{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;align-items:center;}'
    + '.stamp{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;border:1.4px dashed rgba(255,255,255,0.35);color:rgba(255,255,255,0.4);}'
    + '.stamp.filled{border:1.4px solid #3f9b72;background:#3f9b72;color:#fff;transform:rotate(-6deg);}'
    + '.stamp-photo{padding:0;overflow:hidden;}'
    + '.stamp-photo img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;}'
    + '.stamp-count{font-size:12px;color:rgba(255,255,255,0.5);margin-left:6px;}'
    + '.content{max-width:700px;margin:0 auto;padding:32px 36px 48px;}'
    + '.week-block:not(:first-child){page-break-before:always;padding-top:6px;}'
    + '.week-block-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:22px;padding-bottom:14px;border-bottom:2.5px solid #9dd3bc;}'
    + '.week-block-title{font-family:"Poppins",sans-serif;font-weight:600;font-size:19px;color:#14435e;}'
    + '.week-block-stamps{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}'
    + '.week-block-stamps .stamp{width:26px;height:26px;font-size:9px;border-color:rgba(11,42,64,0.25);color:rgba(11,42,64,0.35);}'
    + '.week-block-stamps .stamp.filled{border-color:#3f9b72;background:#3f9b72;color:#fff;}'
    + '.stamp-count-inline{font-size:11px;color:rgba(11,42,64,0.5);margin-left:4px;}'
    + '.dept-section{margin-bottom:28px;}'
    + '.dept-title{font-family:"Poppins",sans-serif;font-weight:600;font-size:17px;color:#14435e;padding-bottom:8px;border-bottom:2.5px solid #9dd3bc;margin-bottom:16px;display:inline-block;}'
    + '.person-card{background:#f8faf9;border:1px solid #e4ece8;border-radius:10px;padding:18px 20px;margin-bottom:14px;page-break-inside:avoid;}'
    + '.person-header{display:flex;align-items:center;gap:12px;margin-bottom:12px;}'
    + '.person-avatar{width:36px;height:36px;border-radius:50%;background:#14435e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}'
    + '.person-avatar-photo{padding:0;overflow:hidden;}'
    + '.person-avatar-photo img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;}'
    + '.person-name{font-family:"Poppins",sans-serif;font-weight:600;font-size:15px;}'
    + '.person-role{font-size:11.5px;color:rgba(11,42,64,0.55);}'
    + '.qa{margin-top:10px;}'
    + '.q-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:#d89a46;margin-bottom:3px;}'
    + '.a-text{font-size:13.5px;line-height:1.55;color:#1a3a50;}'
    + '.a-text a{color:#14435e;font-weight:600;}'
    + '.submitted-at{font-size:10.5px;color:rgba(11,42,64,0.45);margin-top:10px;}'
    + '.no-update{font-size:13px;color:rgba(11,42,64,0.45);font-style:italic;padding:8px 0;}'
    + '.footer{text-align:center;font-size:10.5px;color:rgba(11,42,64,0.35);padding:24px 0 32px;border-top:1px solid #e8ece9;margin-top:24px;}'
    + '@media print{.cover{-webkit-print-color-adjust:exact;print-color-adjust:exact;}.content{padding:20px 0;}}'
    + '@page{margin:0.6in 0.5in;}'
    + '</style></head><body>'
    + '<div class="cover">'
    + '  <div class="eyebrow">Nugttah · Marketing Team</div>'
    + '  <h1>Weekly Growth Log</h1>'
    + '  <div class="cover-underline"></div>'
    + '  <div class="cover-meta">'+esc(rangeLabel)+' · Generated '+esc(now)+'</div>'
    + '  <div class="stamp-bar">'
    + TEAM.map(function(p){ return stampHtml(p, !!unionSubmitted[p.id]); }).join('')
    + '  <span class="stamp-count">'+unionCount+' / '+TEAM.length+(multi?' contributed':' stamped')+'</span>'
    + '  </div>'
    + '</div>'
    + '<div class="content">'
    + body
    + '<div class="footer">Nugttah Weekly Growth Log · Internal document · '+esc(rangeLabel)+'</div>'
    + '</div>'
    + '<script>window.onload=function(){window.print();}<\/script>'
    + '</body></html>';
  }

  // ---------- ambient background: subtle mouse parallax on desktop ----------
  // Touch devices get the CSS drift animation instead (no mousemove to react
  // to); prefers-reduced-motion disables both, handled entirely in CSS.
  // The gate (name-picker) has its own bigger, always-on CSS animation —
  // skipped here entirely, since a JS-set inline transform would just fight
  // a running CSS animation on the same property every frame.
  (function(){
    var g1 = document.querySelector('.ambient-glow-1');
    var g2 = document.querySelector('.ambient-glow-2');
    if(!g1 || !g2) return;
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if(!window.matchMedia('(hover:hover)').matches) return;
    var raf = null;
    window.addEventListener('mousemove', function(e){
      if(document.body.classList.contains('gate-active')) return;
      if(raf) return;
      raf = requestAnimationFrame(function(){
        raf = null;
        var xPct = (e.clientX / window.innerWidth) - 0.5;   // -0.5 .. 0.5
        var yPct = (e.clientY / window.innerHeight) - 0.5;
        g1.style.transform = 'translate3d(' + (-28 + xPct*22) + 'vw,' + (-26 + yPct*22) + 'vh,0)';
        g2.style.transform = 'translate3d(' + (26 - xPct*22) + 'vw,' + (22 - yPct*22) + 'vh,0)';
      });
    }, {passive:true});
  })();

  // ---------- init ----------
  renderGate();
})();
</script>
