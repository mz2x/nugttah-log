<title>Nugttah Weekly Growth Log</title>

<style>
  :root{
    /* sampled directly from the Nugttah x Barq brand deck */
    --espresso-900:#14435e;   /* brand navy — page bg, avatar, toast */
    --espresso-700:#184969;   /* secondary navy — labels on white */
    --cream-50:#ffffff;       /* white — text on navy, card surfaces */
    --cream-100:#dcefe6;      /* light mint tint — selected / highlight bg */
    --crema-500:#ecaf5f;      /* brand amber — logo pill, CTAs, active tab */
    --crema-600:#d89a46;      /* amber hover */
    --mint-500:#9dd3bc;       /* brand mint — eyebrows, underlines, subheads */
    --green-600:#3f9b72;      /* deep mint — filled stamp / checkmark bg */
    --green-100:#eaf5ef;      /* light mint tint (spare) */
    --ink:#0b2a40;            /* deep navy ink — primary text on white */
    --muted:rgba(11,42,64,0.58);
    --hollow:rgba(255,255,255,0.16);
    --radius:14px;
    --font-display:'Poppins', -apple-system, sans-serif;
    --font-body:'Inter', -apple-system, sans-serif;
    --font-mono:'Inter', -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--espresso-900);
    background-image:
      radial-gradient(ellipse 800px 500px at 15% -10%, rgba(236,175,95,0.14), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(157,211,188,0.16), transparent 55%);
    color:var(--cream-50);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .wrap{max-width:760px;margin:0 auto;padding:28px 18px 64px;position:relative;}
  .topbar{padding:6px 4px 22px;position:relative;}
  .topbar::before{
    content:'';position:absolute;top:-210px;left:50%;transform:translateX(-50%);
    width:900px;height:900px;border-radius:50%;
    border:1px solid rgba(255,255,255,0.14);
    pointer-events:none;z-index:0;
  }
  .topbar > *{position:relative;z-index:1;}
  .eyebrow{
    font-family:var(--font-body);
    font-weight:600;
    font-size:11.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--mint-500);
    margin-bottom:8px;
  }
  .h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:clamp(28px,5vw,38px);
    line-height:1.08;
    margin:0;
    color:var(--cream-50);
  }
  .brand-underline{width:60px;height:4px;border-radius:4px;background:var(--mint-500);margin-top:12px;}
  .sub{color:rgba(255,255,255,0.62);font-size:14.5px;margin-top:10px;}

  .top-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin:22px 0 14px;}
  .role-note{color:rgba(255,255,255,0.55);font-size:12.5px;}
  .link-onnavy{background:none;border:none;color:rgba(255,255,255,0.6);font-size:12.5px;text-decoration:underline;cursor:pointer;padding:0;}
  .link-onnavy:hover{color:#fff;}

  .tabs{display:flex;gap:8px;margin:0 0 22px;position:relative;z-index:1;}
  .tab{
    font-family:var(--font-body);
    font-weight:600;
    font-size:13.5px;
    padding:11px 16px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.18);
    background:transparent;
    color:rgba(255,255,255,0.68);
    cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .tab:hover{border-color:rgba(255,255,255,0.38);color:var(--cream-50);}
  .tab.active{background:var(--crema-500);border-color:var(--crema-500);color:var(--espresso-900);}
  .tab:focus-visible{outline:2px solid var(--crema-500);outline-offset:2px;}

  .card{
    background:var(--cream-50);
    color:var(--ink);
    border-radius:var(--radius);
    padding:22px 22px 24px;
    box-shadow:0 18px 40px -20px rgba(0,0,0,0.55);
  }
  .card + .card{margin-top:16px;}

  .perforation{
    height:1px;
    margin:18px 0;
    background-image:repeating-linear-gradient(to right, rgba(11,42,64,0.20) 0 6px, transparent 6px 12px);
  }

  .or-divider{display:flex;align-items:center;gap:10px;margin:20px 0 14px;color:var(--muted);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;}
  .or-divider::before,.or-divider::after{content:'';flex:1;height:1px;background:rgba(11,42,64,0.15);}
  .manager-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  input[type="password"], input[type="text"]{
    font-family:var(--font-body);font-size:14.5px;color:var(--ink);
    background:#fff;border:1.4px solid rgba(11,42,64,0.2);border-radius:10px;
    padding:10px 12px;max-width:200px;
  }
  input[type="password"]:focus, input[type="text"]:focus{outline:2px solid var(--crema-500);outline-offset:1px;border-color:var(--crema-500);}
  .error-text{color:#c0483f;font-size:12.5px;margin-top:9px;}

  .file-list{margin-top:8px;display:flex;flex-direction:column;gap:6px;}
  .file-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:8px 10px;border-radius:8px;background:var(--cream-100);font-size:13px;
  }
  .file-row a{color:var(--ink);text-decoration:none;font-weight:600;}
  .file-row a:hover{text-decoration:underline;}
  .file-remove{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;}
  .file-remove:hover{color:#c0483f;}
  .upload-status{font-size:12.5px;color:var(--muted);margin-top:8px;}
  .upload-status.busy{animation:pulse 1.4s ease-in-out infinite;}
  @media (prefers-reduced-motion: no-preference){
    @keyframes pulse{0%,100%{opacity:.55;}50%{opacity:1;}}
  }

  /* --- stamp row (signature element) --- */
  .stamp-summary{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:6px;}
  .stamp-row{display:flex;gap:8px;flex-wrap:wrap;}
  .stamp{
    width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-body);font-size:11px;font-weight:700;
    border:1.6px dashed rgba(11,42,64,0.26);
    color:rgba(11,42,64,0.36);
    position:relative;
  }
  .stamp.filled{
    border:1.6px solid var(--green-600);
    background:var(--green-600);
    color:#fff;
    transform:rotate(-6deg);
  }
  .stamp-count{font-family:var(--font-mono);font-size:12.5px;color:var(--muted);}

  .field{margin-top:16px;}
  .field label{
    display:block;font-size:13.5px;font-weight:600;
    margin-bottom:6px;color:var(--ink);
  }
  textarea, select{
    width:100%;
    font-family:var(--font-body);
    font-size:14.5px;
    color:var(--ink);
    background:#fff;
    border:1.4px solid rgba(11,42,64,0.18);
    border-radius:10px;
    padding:10px 12px;
    resize:vertical;
    min-height:64px;
  }
  select{min-height:auto;padding:9px 10px;}
  textarea:focus, select:focus{outline:2px solid var(--crema-500);outline-offset:1px;border-color:var(--crema-500);}

  .btn{
    font-family:var(--font-body);font-weight:700;font-size:14px;
    padding:12px 18px;border-radius:10px;border:none;cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--crema-500);color:var(--espresso-900);}
  .btn-primary:hover{background:var(--crema-600);}
  .btn-ghost{background:transparent;color:var(--espresso-700);border:1.4px solid rgba(11,42,64,0.22);}
  .btn-ghost:hover{border-color:rgba(11,42,64,0.4);}
  .btn:focus-visible{outline:2px solid var(--espresso-900);outline-offset:2px;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}

  .row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .link-btn{background:none;border:none;color:var(--muted);font-size:12.5px;text-decoration:underline;cursor:pointer;padding:0;}

  .week-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px;}
  .week-bar label{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,0.6);}
  .week-bar select{max-width:240px;}

  /* --- chip grid (person picker, gate only) --- */
  .dept-group{margin-top:18px;}
  .dept-group:first-child{margin-top:2px;}
  .dept-label{
    font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);margin-bottom:8px;
  }
  .chip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;}
  .chip{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:12px 8px 10px;border-radius:12px;
    border:1.4px solid rgba(11,42,64,0.14);background:#fff;
    cursor:pointer;text-align:center;position:relative;
    transition:border-color .12s ease, transform .12s ease;
  }
  .chip:hover{border-color:var(--crema-500);}
  .chip:focus-visible{outline:2px solid var(--crema-500);outline-offset:2px;}
  .avatar{
    width:40px;height:40px;border-radius:50%;
    background:var(--espresso-900);color:var(--cream-50);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);font-weight:600;font-size:13px;
  }
  .avatar-photo{
    width:40px;height:40px;border-radius:50%;
    object-fit:cover;display:block;
    border:1.5px solid rgba(11,42,64,0.1);
  }
  .chip .name{font-size:12.5px;font-weight:700;color:var(--ink);}
  .chip .title{font-size:10.5px;color:var(--muted);line-height:1.25;}

  /* --- report cards --- */
  .report-dept-title{
    font-family:var(--font-display);font-weight:600;font-size:19px;
    margin:26px 0 14px;color:var(--cream-50);
    position:relative;padding-bottom:9px;
  }
  .report-dept-title::after{
    content:'';position:absolute;left:0;bottom:0;width:38px;height:3px;border-radius:3px;
    background:var(--mint-500);
  }
  .report-dept-title:first-of-type{margin-top:6px;}
  .person-card{margin-bottom:12px;}
  .person-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .person-name{font-family:var(--font-display);font-weight:600;font-size:18px;}
  .person-title{font-size:12px;color:var(--muted);}
  .qa{margin-top:12px;}
  .qa .q{font-size:12px;font-weight:700;color:var(--crema-600);text-transform:uppercase;letter-spacing:.02em;}
  .qa .a{font-size:14.5px;margin-top:4px;line-height:1.5;}
  .empty-note{
    margin-top:12px;padding:10px 12px;border-radius:8px;
    border:1.4px dashed rgba(11,42,64,0.25);color:var(--muted);font-size:13px;
  }
  .meta-time{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-top:10px;}

  .actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--espresso-900);color:var(--cream-50);
    border:1px solid var(--crema-500);
    padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:600;
    box-shadow:0 12px 30px -12px rgba(0,0,0,0.6);
    opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;
    z-index:50;
    max-width:88vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .loading{color:var(--muted);font-size:13.5px;padding:12px 2px;}

  @media (prefers-reduced-motion: no-preference){
    .stamp.filled{animation:stampin .28s ease;}
    @keyframes stampin{from{transform:scale(0.5) rotate(-6deg);opacity:0;}to{transform:scale(1) rotate(-6deg);opacity:1;}}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }

  @media print{
    body{background:#fff;color:#000;}
    .topbar .eyebrow{color:#2f6b52;}
    .topbar::before{display:none;}
    #authArea,#topRow,.tabs,.actions,.week-bar .link-btn,.chip-grid,.dept-group,#formArea,.toast{display:none !important;}
    .card{box-shadow:none;border:1px solid #ddd;}
    .wrap{max-width:100%;padding:0;}
  }

  footer{margin-top:36px;text-align:center;font-family:var(--font-mono);font-size:11px;color:rgba(255,255,255,0.4);}
</style>
</head>

  // ---------- utils ----------
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }
  function initials(name){ return name.slice(0,2).toUpperCase(); }
  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function toISODate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function getWeekStart(date){
    var d = new Date(date); d.setHours(0,0,0,0);
    var day = d.getDay();
    d.setDate(d.getDate()-day);
    return d;
  }
  function currentWeekId(){ return toISODate(getWeekStart(new Date())); }
  function weekIdOffset(weekId, weeksBack){
    var d = new Date(weekId+'T00:00:00');
    d.setDate(d.getDate()-weeksBack*7);
    return toISODate(d);
  }
  function formatWeekLabel(weekId){
    // Saudi work week: Sunday through Thursday
    var start = new Date(weekId+'T00:00:00');
    var end = new Date(start); end.setDate(end.getDate()+4);
    var startStr = start.toLocaleDateString('en-US', {month:'short', day:'numeric'});
    var endStr = end.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
    return 'Week of ' + startStr + ' – ' + endStr;
  }
  function formatTime(iso){
    try{
      var d = new Date(iso);
      return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ', ' + d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    }catch(e){ return ''; }
  }

  // ---------- file uploads (Cloudinary) ----------
  // Firestore handles all the text data above; file uploads go straight to
  // Cloudinary's CDN via an "unsigned" upload preset — a pattern built for
  // exactly this (direct browser upload, no server code, proper CORS support
  // out of the box). Free, no card required.
  // 1. Sign up at cloudinary.com (Google sign-in is fine, no card).
  // 2. Copy your "Cloud name" from the dashboard.

  //    Signing Mode: Unsigned -> Save. Copy the preset name.
  // 4. Paste both values below.
  var CLOUDINARY_CLOUD_NAME = "qpjlf7gd";
  var CLOUDINARY_UPLOAD_PRESET = "nugttah_uploads";

  function cloudinaryReady(){
    return CLOUDINARY_CLOUD_NAME.indexOf('PASTE_YOUR') !== 0
        && CLOUDINARY_UPLOAD_PRESET.indexOf('PASTE_YOUR') !== 0;
  }

  function uploadFile(file, onProgress){
    return new Promise(function(resolve, reject){
      if(!cloudinaryReady()){ reject(new Error('cloudinary-not-configured')); return; }
      var url = 'https://api.cloudinary.com/v1_1/' + CLOUDINARY_CLOUD_NAME + '/auto/upload';
      var formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

      var xhr = new XMLHttpRequest();
      xhr.open('POST', url, true);
      xhr.upload.onprogress = function(e){
        if(onProgress && e.lengthComputable){
          onProgress(Math.round((e.loaded / e.total) * 100));
        }
      };
      xhr.onload = function(){
        if(xhr.status >= 200 && xhr.status < 300){
          try{
            var data = JSON.parse(xhr.responseText);
            resolve({ name: data.original_filename || file.name, url: data.secure_url });
          }catch(e){
            reject(new Error('bad-response-from-cloudinary'));
          }
        } else {
          var msg = 'upload-failed (status ' + xhr.status + ')';
          try{
            var errData = JSON.parse(xhr.responseText);
            if(errData && errData.error && errData.error.message) msg = errData.error.message;
          }catch(e){}
          reject(new Error(msg));
        }
      };
      xhr.onerror = function(){ reject(new Error('network-error')); };
      xhr.send(formData);
    });
  }


  async function getSubmission(weekId, personId){
    if(!db) return null;
    try{
      var doc = await db.collection('submissions').doc(weekId+'_'+personId).get();
      return doc.exists ? doc.data() : null;
    }catch(e){ console.error('getSubmission failed', e); return null; }
  }
  async function saveSubmission(weekId, personId, payload){
    if(!db) throw new Error('firebase-not-configured');
    await db.collection('submissions').doc(weekId+'_'+personId).set(payload);
    try{ await ensureWeekInIndex(weekId); }
    catch(e){ console.error('index update failed (non-fatal)', e); }
  }
  // One query for the whole week — Firestore's document-ID range trick,
  // genuinely a single fast round-trip (this was 8 separate slow calls
  // back when the backend was Apps Script).
  async function getSubmittedMap(weekId){
    var map = {};
    if(!db) return map;
    try{
      var prefix = weekId+'_';
      var snap = await db.collection('submissions')
        .orderBy(firebase.firestore.FieldPath.documentId())
        .startAt(prefix)
        .endAt(prefix+'\uf8ff')
        .get();
      snap.forEach(function(doc){
        map[doc.id.slice(prefix.length)] = doc.data();
      });
    }catch(e){ console.error('getSubmittedMap failed', e); }
    return map;
  }
  async function getWeeksIndex(){
    if(!db) return [];
    try{
      var doc = await db.collection('meta').doc('weeksIndex').get();
      return (doc.exists && Array.isArray(doc.data().weeks)) ? doc.data().weeks : [];
    }catch(e){ return []; }
  }
  async function ensureWeekInIndex(weekId){
    var idx = await getWeeksIndex();
    if(idx.indexOf(weekId) === -1){
      idx.push(weekId); idx.sort(); idx.reverse();
      await db.collection('meta').doc('weeksIndex').set({ weeks: idx });
    }
  }

      return doc.exists ? doc.data().pin : null;

    if(!db) throw new Error('firebase-not-configured');
    await db.collection('pins').doc(personId).set({ pin: pin });

    if(!db) return false;
    try{ await db.collection('pins').doc(personId).delete(); return true; }
    catch(e){ console.error('deletePin failed', e); return false; }
  }


  // ---------- shared render helper ----------
  function normalizeAttachments(items){
    if(!items) return [];
    if(Array.isArray(items)){
      return items.map(function(it){
        if(it && typeof it === 'object') return { name: it.name || it.url, url: it.url };
        return { name: String(it), url: String(it) };
      });
    }
    if(typeof items === 'string' && items.trim()){
      return items.split('\n').map(function(s){ return s.trim(); }).filter(Boolean).map(function(link){
        return { name: link, url: link };
      });
    }
    return [];
  }
  function attachmentLinksHtml(sub){
    var list = normalizeAttachments(sub && sub.attachments);
    if(!list.length) return '';
    var out = '<div class="qa"><div class="q">Attachments</div><div class="a">';
    list.forEach(function(item){
      var safeHref = /^https?:\/\//i.test(item.url) ? esc(item.url) : '#';
      out += '<div><a href="'+safeHref+'" target="_blank" rel="noopener noreferrer">📎 '+esc(item.name)+'</a></div>';
    });
    out += '</div></div>';
    return out;
  }
  function personCardHtml(person, sub){
    var out = '<div class="card person-card">';
    out += '  <div class="person-head"><div><div class="person-name">'+esc(person.name)+'</div><div class="person-title">'+esc(person.title)+'</div></div></div>';
    if(sub){
      person.questions.forEach(function(q){
        var ans = (sub.answers && sub.answers[q.id]) ? sub.answers[q.id] : '';
        if(!ans) return;
        out += '<div class="qa"><div class="q">'+esc(q.label)+'</div><div class="a">'+nl2br(ans)+'</div></div>';
      });
      out += attachmentLinksHtml(sub);
      out += '<div class="meta-time">Submitted '+esc(formatTime(sub.submittedAt))+'</div>';
    } else {
      out += '<div class="empty-note">No update submitted yet.</div>';
    }
    out += '</div>';
    return out;
  }

      el.textContent = msg;

    async function submitPin(){
      var btn = document.getElementById('pinSubmitBtn');
      var val1 = (document.getElementById('pin1').value||'').trim();
      if(creating){
        var val2 = (document.getElementById('pin2').value||'').trim();
        if(val1.length < 4){ showPinError('Use at least 4 characters.'); return; }
        if(val1 !== val2){ showPinError('Passcodes do not match.'); return; }
        btn.disabled = true; btn.textContent = 'Saving…';
        try{
          await setPin(person.id, val1);

          showPinError('Could not save your passcode — try again.');

      } else {

    pHtml += '  </div>';
    pHtml += '</form>';

    function renderFileList(){
      var el = document.getElementById('fileList');
      if(!el) return;
      if(!currentAttachments.length){ el.innerHTML = ''; return; }
      var html = '';
      currentAttachments.forEach(function(f, idx){
        html += '<div class="file-row"><a href="'+esc(f.url)+'" target="_blank" rel="noopener noreferrer">📎 '+esc(f.name)+'</a><button type="button" class="file-remove" data-idx="'+idx+'" title="Remove">✕</button></div>';
      });
      el.innerHTML = html;
      el.querySelectorAll('.file-remove').forEach(function(btn){
        btn.onclick = function(){
          currentAttachments.splice(parseInt(btn.dataset.idx, 10), 1);
          renderFileList();
        };
      });
    }
    renderFileList();

    document.getElementById('chooseFilesBtn').onclick = function(){
      document.getElementById('fileInput').click();
    };
    document.getElementById('fileInput').onchange = async function(e){
      var files = Array.prototype.slice.call(e.target.files || []);
      if(!files.length) return;
      var statusEl = document.getElementById('uploadStatus');
      statusEl.classList.add('busy');
      for(var i=0;i<files.length;i++){
        statusEl.textContent = 'Uploading ' + files[i].name + ' (' + (i+1) + '/' + files.length + ')… 0%';
        try{
          var result = await uploadFile(files[i], function(pct){
            statusEl.textContent = 'Uploading ' + files[i].name + ' (' + (i+1) + '/' + files.length + ')… ' + pct + '%';
          });
          currentAttachments.push(result);
          renderFileList();
        }catch(err){
          console.error(err);
          var detail = (err && err.message) ? err.message : String(err);
          if(detail === 'cloudinary-not-configured'){
            showToast("Setup isn't finished — Mazen needs to add the Cloudinary details yet.");
          } else {
            showToast('Upload failed for ' + files[i].name + ': ' + detail);
          }
        }
      }
      statusEl.classList.remove('busy');
      statusEl.textContent = '';
      e.target.value = '';
    };

    document.getElementById('answerForm').onsubmit = async function(e){
      e.preventDefault();
      var submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true; submitBtn.textContent = 'Stamping…';
      var newAnswers = {};
      person.questions.forEach(function(q){
        newAnswers[q.id] = document.getElementById('q_'+q.id).value.trim();
      });
      var payload = {
        personId: person.id, name: person.name, title: person.title, dept: person.dept,
        answers: newAnswers,
        attachments: currentAttachments,
        submittedAt: new Date().toISOString()
      };
      try{
        await saveSubmission(state.submitWeekId, person.id, payload);
        showToast('Stamped! Thanks, ' + person.name + '.');
        renderSubmitView();
      }catch(err){
        console.error(err);
        submitBtn.disabled = false; submitBtn.textContent = 'Stamp my update';
        var detail = (err && err.message) ? err.message : String(err);
        if(detail === 'firebase-not-configured'){
          showToast("Setup isn't finished — Mazen needs to add the Firebase config yet.");
        } else {
          showToast('Save failed: ' + detail + ' — try again or tell Mazen this message.');
        }
      }
    };
    document.getElementById('clearBtn').onclick = function(){
      person.questions.forEach(function(q){
        var el = document.getElementById('q_'+q.id);
        if(el) el.value = '';
      });
      currentAttachments = [];
      renderFileList();
    };
  }

  function buildPlainTextReport(weekId, submitted){
    var lines = [];
    lines.push('NUGTTAH — WEEKLY GROWTH LOG');
    lines.push(formatWeekLabel(weekId));
    lines.push('');
    DEPT_ORDER.forEach(function(dept){
      var people = teamByDept(dept);
      if(!people.length) return;
      lines.push('== ' + dept.toUpperCase() + ' ==');
      people.forEach(function(p){
        var sub = submitted[p.id];
        lines.push('');
        lines.push(p.name + ' — ' + p.title);
        if(sub){
          p.questions.forEach(function(q){
            var ans = (sub.answers && sub.answers[q.id]) ? sub.answers[q.id] : '';
            if(!ans) return;
            lines.push('  ' + q.label);
            lines.push('  > ' + ans.replace(/\n/g,'\n  > '));
          });
          var attList = normalizeAttachments(sub.attachments);
          if(attList.length){
            lines.push('  Attachments');
            attList.forEach(function(item){ lines.push('  > ' + item.name + ' — ' + item.url); });
          }
        } else {
          lines.push('  (no update submitted)');
        }
      });
      lines.push('');
    });
    return lines.join('\n');
  }

  function buildBrandedReport(weekId, submitted){
    var weekLabel = formatWeekLabel(weekId);
    var submittedCount = Object.keys(submitted).length;

      var people = teamByDept(dept);

      body += '<div class="dept-section">';
      body += '  <h2 class="dept-title">'+esc(dept)+'</h2>';
      people.forEach(function(p){
        var sub = submitted[p.id];
        body += '<div class="person-card">';
        body += '  <div class="person-header">';
        body += '    <div class="person-avatar">'+esc(initials(p.name))+'</div>';

        body += '  </div>';
        if(sub){
          p.questions.forEach(function(q){
            var ans = (sub.answers && sub.answers[q.id]) ? sub.answers[q.id] : '';
            if(!ans) return;
            body += '<div class="qa"><div class="q-label">'+esc(q.label)+'</div><div class="a-text">'+nl2br(ans)+'</div></div>';
          });
          var atts = normalizeAttachments(sub.attachments);
          if(atts.length){
            body += '<div class="qa"><div class="q-label">Attachments</div><div class="a-text">';
            atts.forEach(function(a){
              body += '<a href="'+esc(a.url)+'" target="_blank">'+esc(a.name)+'</a><br>';
            });
            body += '</div></div>';
          }
          body += '<div class="submitted-at">Submitted '+esc(formatTime(sub.submittedAt))+'</div>';
        } else {
          body += '<div class="no-update">No update submitted</div>';
        }
        body += '</div>';
      });
      body += '</div>';
    });

    + '<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">'
    + '<style>'
    + '*{box-sizing:border-box;margin:0;padding:0;}'

    + '.eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#9dd3bc;margin-bottom:10px;}'
    + '.cover h1{font-family:"Poppins",sans-serif;font-weight:600;font-size:32px;line-height:1.1;}'
    + '.cover-underline{width:50px;height:3.5px;border-radius:3px;background:#9dd3bc;margin:14px 0 12px;}'
    + '.cover-meta{font-size:13px;color:rgba(255,255,255,0.6);margin-top:6px;}'
    + '.stamp-bar{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;align-items:center;}'
    + '.stamp{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;border:1.4px dashed rgba(255,255,255,0.35);color:rgba(255,255,255,0.4);}'
    + '.stamp.filled{border:1.4px solid #3f9b72;background:#3f9b72;color:#fff;transform:rotate(-6deg);}'
    + '.stamp-count{font-size:12px;color:rgba(255,255,255,0.5);margin-left:6px;}'
    + '.content{max-width:700px;margin:0 auto;padding:32px 36px 48px;}'

    + '.dept-title{font-family:"Poppins",sans-serif;font-weight:600;font-size:17px;color:#14435e;padding-bottom:8px;border-bottom:2.5px solid #9dd3bc;margin-bottom:16px;display:inline-block;}'
    + '.person-card{background:#f8faf9;border:1px solid #e4ece8;border-radius:10px;padding:18px 20px;margin-bottom:14px;page-break-inside:avoid;}'
    + '.person-header{display:flex;align-items:center;gap:12px;margin-bottom:12px;}'
    + '.person-avatar{width:36px;height:36px;border-radius:50%;background:#14435e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}'
